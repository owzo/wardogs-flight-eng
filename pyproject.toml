[project]
name = "wardogs-flight-eng"
version = "0.2.0"
description = "Force-feedback synthesiser for Wardogs helicopters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Skye Stubbins" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30",
]

[project.scripts]
wardogs-flight-eng = "wardogs_flight_eng.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
